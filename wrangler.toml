name = "macmladen"
compatibility_date = "2026-09-08"

# Custom domains: the deploy attaches the Worker to the zone and writes the DNS
# records itself, replacing the GitHub Pages records. Mladen runs that deploy.
routes = [
  { pattern = "macmladen.com", custom_domain = true },
  { pattern = "www.macmladen.com", custom_domain = true },
]

# Deploy target: Cloudflare Worker with static assets (docs/decisions/M1-DEPLOY-TARGET.md).
# The adapter writes dist/client (assets) and dist/server (worker) and generates
# dist/server/wrangler.json from this file; deploy with
#   npx wrangler deploy --config dist/server/wrangler.json

# D1 holds the workshop registrations. The binding name DB is what
# src/pages/api/register.astro reads off Astro.locals.runtime.env.
# database_id is the production database, created 2026-09-09 with `wrangler d1 create macmladen-registrations`
# (Fable, 2026-09-09). Local development does not use
# the id at all — `wrangler d1 ... --local` keys off database_name.
[[d1_databases]]
binding = "DB"
database_name = "macmladen-registrations"
database_id = "b79139e4-c2de-401d-9d2f-ab79773c968c"
migrations_dir = "migrations"

# The Astro Cloudflare adapter injects a SESSION binding into the generated worker
# config; nothing here uses sessions, but wrangler refuses a KV binding without an
# id, so the namespace exists (created 2026-09-09) and is bound here.
[[kv_namespaces]]
binding = "SESSION"
id = "aa96701073304957be05068faa6f1b6b"

# Plain (non-secret) variables read by the Worker.
[vars]
MAILERLITE_GROUP_ID = "198135774424598339"
