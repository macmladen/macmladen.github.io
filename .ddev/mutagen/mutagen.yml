# Project-owned override, checked into git on purpose.
# DDEV regenerates this file whenever it finds its own generated-marker comment
# anywhere in it, so do not paste that marker back in. A `ddev mutagen reset`
# also regenerates the default; re-apply this file if you ever run one.
# https://ddev.readthedocs.io/en/stable/users/install/performance/#mutagen
sync:
  defaults:
    mode: "two-way-resolved"
    stageMode: "neighboring"
    ignore:
      paths:
        # The top-level .git directory is ignored because where possible it's
        # mounted into the container with a traditional docker bind-mount
        - "/.git"
        - "/.tarballs"
        - "/.ddev/db_snapshots"
        - "/.ddev/.importdb*"
        - ".DS_Store"
        - ".idea"

        # node_modules is deliberately NOT synced. The container runs Linux and
        # the host runs macOS, and packages such as rolldown and esbuild ship
        # platform-specific native binaries. Syncing one over the other breaks
        # whichever side installed first ("Cannot find native binding"). The
        # container installs its own copy on start; see web_extra_daemons in
        # ../config.yaml.
        - "/node_modules"
    symlink:
      mode: "posix-raw"
